<body data-page="contact" data-depth="0">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header" id="site-header"></header>

<main id="main">
  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow">Contact</span>
      <h1>Questions, feedback, or a topic idea?</h1>
      <p class="lede">Send a message below and we'll get back to you by email.</p>
    </div>
  </section>

  <section class="content-page">
    <div class="wrap-narrow">
      <form id="contact-form" novalidate>
        <input type="checkbox" name="botcheck" class="visually-hidden" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <div class="form-grid">
          <div class="form-field">
            <label for="name">Name <span class="req">*</span></label>
            <input type="text" id="name" name="name" minlength="2" required />
            <span class="field-error"></span>
          </div>
          <div class="form-field">
            <label for="email">Email <span class="req">*</span></label>
            <input type="email" id="email" name="email" required />
            <span class="field-error"></span>
          </div>
          <div class="form-field full">
            <label for="subject">Subject <span class="req">*</span></label>
            <input type="text" id="subject" name="subject" minlength="3" required />
            <span class="field-error"></span>
          </div>
          <div class="form-field full">
            <label for="message">Message <span class="req">*</span></label>
            <textarea id="message" name="message" minlength="10" required></textarea>
            <span class="field-error"></span>
          </div>
        </div>
        <button type="submit" class="btn btn-primary mt-24">Send Message</button>
        <p class="form-status" id="contact-status" role="status" aria-live="polite"></p>
      </form>

      <div class="callout mt-48">
        <p><strong>How this works:</strong> messages sent through this form go straight to our team's inbox, and we reply by email. Looking to hire us for a project? See our <a href="services.html">Services page</a>.</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

</body>
